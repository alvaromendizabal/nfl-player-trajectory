name: Quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: '2'
      OPENBLAS_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          python-version: '3.11.15'
          enable-cache: true
      - name: Install the retained public stack
        run: uv sync --frozen --group dev
      - name: Check all maintained native components and final evaluation contracts
        run: uv run --frozen python scripts/quality.py
      - name: Independently generate and verify the public forecast review
        run: |
          python3 -B -S review/run.py --output "$RUNNER_TEMP/public-review"
          python3 -B -S review/run.py --output "$RUNNER_TEMP/public-review" --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: verified-trajectory-review
          path: ${{ runner.temp }}/public-review/
          if-no-files-found: error
          retention-days: 14
