name: Quality
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.33'
          enable-cache: true
          prune-cache: true
          download-from-astral-mirror: false
      - name: Capture tested source
        run: |
          mkdir -p artifacts
          git archive --format=tar.gz --output=artifacts/source.tar.gz HEAD
      - run: uv sync --frozen --group dev
      - run: uv run --frozen python scripts/quality.py
      - name: Retain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: validation-evidence
          path: |
            logs/
            artifacts/source.tar.gz
            artifacts/quality.json
            artifacts/demo/
            artifacts/notebooks/
            artifacts/kaggle/
          retention-days: 30
          if-no-files-found: error
