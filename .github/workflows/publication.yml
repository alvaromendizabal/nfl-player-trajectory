name: Public Research Evidence
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: publication-${{ github.ref }}
  cancel-in-progress: true
jobs:
  publication:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Validate publication and privacy boundaries
        run: python3 research/publication/validate.py
