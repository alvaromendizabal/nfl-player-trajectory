name: Recent Model Evidence
on:
  pull_request:
  push:
    branches: [main, 'feat/winner-evidence-*']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          enable-cache: true
          download-from-astral-mirror: false
      - name: Execute aggregate-only model review
        run: uv run --frozen --with nbclient==0.10.2 python research/publication/recent_models.py
      - name: Publish explicitly requested research snapshot
        if: >-
          github.event_name == 'push' &&
          startsWith(github.ref, 'refs/heads/feat/winner-evidence-') &&
          contains(github.event.head_commit.message, '[render winner evidence]')
        run: |
          set -euo pipefail
          python3 research/publication/register_recent.py
          git add -- README.md docs/MODEL_CARD.md docs/results/frontier_submission.json research/RECENT_MODELS.ipynb research/evidence/model_reproduction.json research/figures/winner_folds.png research/figures/winner_confirmation.png research/figures/winner_diversity.png research/figures/winner_private_score.png research/figures/winner_horizon.png research/publication/files.json research/publication/recent_models.py research/publication/register_recent.py research/publication/validate.py .github/workflows/recent-models.yml
          python3 research/publication/validate.py
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: preserve executed frontier model review with registered public hashes'
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
