name: Recent Model Evidence
on:
  pull_request:
  push:
    branches: [main, 'feat/winner-evidence-20260922']
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: '0.11.33'
          enable-cache: true
          download-from-astral-mirror: false
      - name: Execute aggregate-only model review
        run: uv run --frozen --with nbclient==0.10.2 python research/publication/recent_models.py
      - name: Publish this explicitly requested research snapshot
        if: >-
          github.event_name == 'push' &&
          github.ref == 'refs/heads/feat/winner-evidence-20260922' &&
          contains(github.event.head_commit.message, '[render winner evidence]')
        run: |
          set -euo pipefail
          git add -- research/RECENT_MODELS.ipynb research/figures/winner_folds.png research/figures/winner_confirmation.png research/figures/winner_horizon.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'docs: preserve executed model review and inline figures'
            git push origin HEAD:feat/winner-evidence-20260922
          fi
