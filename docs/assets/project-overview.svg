<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420" role="img" aria-labelledby="title description">
  <title id="title">Player trajectory forecasting: research and engineering results</title>
  <desc id="description">ML research, AWS engineering, and reproducible evidence. Recorded private RMSE: 0.46468. Inference acceleration: 4.784 times on a 96-play benchmark with exact parity. Games evaluated: 272. The decorative football trajectory drawing is illustrative and contains no player data.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#142a36"/>
      <stop offset="1" stop-color="#0c1c29"/>
    </linearGradient>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#193c45"/>
      <stop offset="1" stop-color="#102936"/>
    </linearGradient>
    <clipPath id="field-clip">
      <rect x="994" y="44" width="358" height="304" rx="20"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1398" height="418" rx="24" fill="url(#background)" stroke="#355363" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
