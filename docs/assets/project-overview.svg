    <text x="66" y="59" fill="#c4d6df" font-size="16" letter-spacing="0.6">ML research · AWS engineering · Reproducible evidence</text>
    <text x="46" y="125" fill="#f6f9fc" font-size="43" font-weight="700" letter-spacing="-1.2">Player trajectory forecasting</text>
    <text x="49" y="164" fill="#b7cbd6" font-size="19">Temporal models. Game-heldout validation. Measured GPU performance.</text>

    <g>
      <rect x="48" y="207" width="288" height="139" rx="14" fill="#19313f" stroke="#36505f"/>
      <text x="69" y="266" fill="#f6f9fc" font-size="44" font-weight="700" letter-spacing="-0.8">0.46468</text>
      <text x="70" y="300" fill="#d4e1e8" font-size="17">Recorded private RMSE</text>
      <text x="70" y="326" fill="#aec5d1" font-size="14">Competition submission</text>
    </g>
    <g>
      <rect x="350" y="207" width="288" height="139" rx="14" fill="#19313f" stroke="#36505f"/>
      <text x="371" y="266" fill="#86e5d0" font-size="44" font-weight="700" letter-spacing="-0.8">4.784×</text>
      <text x="372" y="300" fill="#d4e1e8" font-size="17">Inference acceleration</text>
      <text x="372" y="326" fill="#aec5d1" font-size="14">96-play benchmark · exact parity</text>
    </g>
    <g>
      <rect x="652" y="207" width="288" height="139" rx="14" fill="#19313f" stroke="#36505f"/>
      <text x="673" y="266" fill="#f6f9fc" font-size="44" font-weight="700" letter-spacing="-0.8">272</text>
      <text x="674" y="300" fill="#d4e1e8" font-size="17">Games evaluated</text>
      <text x="674" y="326" fill="#aec5d1" font-size="14">Game-heldout evaluation</text>
    </g>
    <text x="49" y="382" fill="#a9c0cd" font-size="14">Separate measurement scopes · Evidence and methodology linked below</text>
  </g>

