  </g>
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1.4"><text x="735" y="141" fill="#a6c0c6">OBSERVED</text><text x="1010" y="141" fill="#b9df89">FORECAST</text></g>
