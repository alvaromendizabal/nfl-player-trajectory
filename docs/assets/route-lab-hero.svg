      <path d="M987 397C1066 411 1121 420 1197 413" stroke="#8ca9ac" stroke-width="3" stroke-dasharray="5 8" opacity=".7"/>
    </g>
    <g fill="#b2cbd3" stroke="#15383e" stroke-width="3"><circle cx="749" cy="396" r="6"/><circle cx="801" cy="382" r="6"/><circle cx="852" cy="358" r="6"/><circle cx="907" cy="328" r="6"/><circle cx="954" cy="309" r="6"/></g>
