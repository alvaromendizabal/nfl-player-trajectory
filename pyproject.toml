[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "nfl-player-trajectory"
version = "0.1.0"
description = "Reproducible NFL player trajectory prediction with temporal validation and interpretable motion analysis."
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.4.6", "pandas==3.0.5", "plotly==7.0.0",
  "filelock==3.32.5", "kaggle==2.2.4", "boto3==1.43.89",
  "ipykernel==7.3.0", "nbformat==5.11.1",
]

[project.scripts]
nfl = "nfl_trajectory.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6", "mypy==2.3.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_trajectory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
