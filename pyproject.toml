[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[project]
name = "nfl-player-trajectory"
version = "0.1.0"
description = "Reproducible NFL player trajectory prediction with temporal validation and interpretable motion analysis."
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy==2.4.6",
  "pandas==3.0.5",
  "plotly==7.0.0",
  "filelock==3.32.5",
  "kaggle==2.2.4",
  "boto3==1.43.89",
  "ipykernel==7.3.0",
  "nbformat==5.11.1",
  "matplotlib==3.10.8",
]

[project.scripts]
nfl = "nfl_trajectory.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.6", "mypy==2.3.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/nfl_trajectory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Source archives have no Git metadata, so .gitignore cannot define lint scope.
# Preserve organizer code and generated artifacts while checking project sources.
extend-exclude = ["data", "artifacts", "logs", ".state", ".downloads", "evidence"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# These bootstrap launchers execute under SageMaker's Python 3.9 base image before
# creating the locked Python 3.11 project environment. datetime.UTC is therefore
# intentionally unavailable here; dedicated tests enforce this compatibility.
"scripts/cloud_motion_engineering.py" = ["UP017"]
"scripts/cloud_motion_scientific.py" = ["UP017"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
